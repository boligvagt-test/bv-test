name: Code tests

# Kun ved ændringer i koden – ikke når indstillingerne rettes.
on:
  push:
    paths: ["boligvagt/**", "tests/**"]
  pull_request:
    paths: ["boligvagt/**", "tests/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s tests -v
